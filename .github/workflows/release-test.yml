name: Test Windows Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/MyContent/MyContent.csproj
      - name: Build
        run: dotnet build src/MyContent/MyContent.csproj --configuration Release --no-restore
      - name: Publish Windows app
        shell: pwsh
        run: |
          dotnet publish src/MyContent/MyContent.csproj `
            --configuration Release `
            --framework net10.0 `
            --runtime win-x64 `
            --self-contained true `
            --output installer/publish