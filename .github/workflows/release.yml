name: Build and Release My Content

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  RELEASE_TAG: v0.1.0

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/MyContent/MyContent.csproj

      - name: Publish Windows app
        shell: pwsh
        run: |
          $version = "0.1.0"
          $assemblyVersion = "${version}.0"

          dotnet publish src/MyContent/MyContent.csproj `
            --configuration Release `
            --framework net10.0 `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=$version `
            -p:AssemblyVersion=$assemblyVersion `
            -p:FileVersion=$assemblyVersion `
            -p:InformationalVersion=$version `
            --output installer/publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
            "/DAppVersion=0.1.0" `
            'installer\MyContent.iss'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: installer/artifacts/MyContent-Setup.exe
