name: Build and Release My Content

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/MyContent/MyContent.csproj

      - name: Build
        run: dotnet build src/MyContent/MyContent.csproj --configuration Release --no-restore

      - name: Publish Windows app
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.1.0' }
          $assemblyVersion = "$version.0"

          dotnet publish src/MyContent/MyContent.csproj `
            --configuration Release `
            --framework net10.0 `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=$version `
            -p:AssemblyVersion=$assemblyVersion `
            -p:FileVersion=$assemblyVersion `
            -p:InformationalVersion=$version `
            --output installer/publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.1.0' }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$version" 'installer\MyContent.iss'

      - name: Upload installer artifact for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: MyContent-Windows-Installer
          path: installer/artifacts/MyContent-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: installer/artifacts/MyContent-Setup.exe
          fail_on_unmatched_files: true
