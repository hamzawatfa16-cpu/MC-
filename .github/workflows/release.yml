name: Build and Release My Content

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix'
        required: true
        default: '0.1.2'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tagVersion = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          $inputVersion = '${{ github.event.inputs.version }}'
          $projectVersion = ([regex]::Match((Get-Content -Raw 'src/MyContent/MyContent.csproj'), '<Version>([^<]+)</Version>')).Groups[1].Value
          $version = if ($tagVersion) { $tagVersion } elseif ($inputVersion) { $inputVersion } else { $projectVersion }
          if (-not $version) { throw 'Could not resolve a My Content version.' }
          $assemblyVersion = "$version.0"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "assemblyVersion=$assemblyVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/MyContent/MyContent.csproj

      - name: Build
        run: dotnet build src/MyContent/MyContent.csproj --configuration Release --no-restore

      - name: Publish Windows app
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $assemblyVersion = '${{ steps.version.outputs.assemblyVersion }}'

          dotnet publish src/MyContent/MyContent.csproj `
            --configuration Release `
            --framework net10.0 `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=$version `
            -p:AssemblyVersion=$assemblyVersion `
            -p:FileVersion=$assemblyVersion `
            -p:InformationalVersion=$version `
            --output installer/publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$version" 'installer\MyContent.iss'

      - name: Upload installer artifact for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: MyContent-Windows-Installer
          path: installer/artifacts/MyContent-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: installer/artifacts/MyContent-Setup.exe
          fail_on_unmatched_files: true
