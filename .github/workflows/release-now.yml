name: Publish My Content v0.1.0

on:
  push:
    branches:
      - release-test

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/MyContent/MyContent.csproj
      - name: Build
        run: dotnet build src/MyContent/MyContent.csproj --configuration Release --no-restore
      - name: Publish
        run: dotnet publish src/MyContent/MyContent.csproj --configuration Release --framework net10.0 --runtime win-x64 --self-contained true --output installer/publish
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=0.1.0" "installer\MyContent.iss"'
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: My Content v0.1.0
          body: First test release of My Content.
          files: installer/artifacts/MyContent-Setup.exe
